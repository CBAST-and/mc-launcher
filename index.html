<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#383838">
  <title>Lanzador del servidor Minecraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #383838; --gui: #c6c6c6; --ink: #1f1f1f; --ink-soft: #4a4a4a;
      --btn: #7d7d7d; --btn-hover: #7f8dc4;
      --grass: #4d8a3a; --redstone: #9c3a35;
      --online: #2f8f2f; --starting: #c08a0b; --offline: #a32d2d;
      --focus: #2a5bff;
      --font-ui: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .page { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin: 0 0 16px; color: #fff; font-size: 28px; font-weight: 600; text-shadow: 3px 3px 0 #1a1a1a; }
    h2 { margin: 0 0 8px; color: #404040; font-size: 19px; font-weight: 600; }
    .gui {
      margin-bottom: 16px; padding: 14px 16px 16px; background: var(--gui);
      border: 2px solid #000; box-shadow: inset 3px 3px 0 #fff, inset -3px -3px 0 #555;
    }
    .meta { margin: 6px 0 0; color: var(--ink-soft); font-size: 14px; }
    .meta code { font-family: var(--font-mono); font-size: 12.5px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .status { display: flex; align-items: center; gap: 10px; font-size: 20px; }
    .dot { flex: none; width: 18px; height: 18px; border: 2px solid #000; background: var(--offline);
      box-shadow: inset 2px 2px 0 rgba(255,255,255,.45), inset -2px -2px 0 rgba(0,0,0,.35); }
    .dot[data-tone="online"] { background: var(--online); }
    .dot[data-tone="busy"] { background: var(--starting); }
    .mc-btn {
      display: inline-block; padding: 9px 14px; background: var(--btn); color: #fff; border: 2px solid #000;
      box-shadow: inset 3px 3px 0 #b8b8b8, inset -3px -3px 0 #474747;
      font: 600 16px var(--font-ui); text-shadow: 2px 2px 0 #333; text-decoration: none; cursor: pointer;
    }
    .mc-btn:hover:not([aria-disabled="true"]):not(:disabled) { background: var(--btn-hover); }
    .mc-btn.grass { background: var(--grass); box-shadow: inset 3px 3px 0 #8fcf72, inset -3px -3px 0 #2a4f1f; }
    .mc-btn.redstone { background: var(--redstone); box-shadow: inset 3px 3px 0 #d98079, inset -3px -3px 0 #5a1c19; }
    .mc-btn:disabled, .mc-btn[aria-disabled="true"] {
      background: #5d5d5d; color: #a2a2a2; text-shadow: none; cursor: not-allowed;
      box-shadow: inset 3px 3px 0 #707070, inset -3px -3px 0 #444;
    }
    .field { width: 100%; padding: 8px 10px; background: #000; color: #fff; border: 2px solid #8b8b8b;
      font: 13.5px var(--font-mono); }
    .label { display: block; margin: 0 0 4px; color: var(--ink-soft); font-size: 14px; font-weight: 600; }
    .error { margin: 0 0 16px; padding: 10px 14px; background: var(--redstone); color: #fff; border: 2px solid #000; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Lanzador del servidor</h1>

    <p id="errorBox" class="error" role="alert" hidden></p>

    <section class="gui" id="tokenSection" hidden>
      <h2>Conectar con GitHub</h2>
      <label class="label" for="tokenInput">Token de acceso personal (clásico, permiso <code>codespace</code>)</label>
      <input type="password" id="tokenInput" class="field" autocomplete="off" spellcheck="false" placeholder="ghp_...">
      <p class="meta">El token se guarda solo en este navegador y solo se envía a api.github.com. Úsalo únicamente en tus dispositivos.</p>
      <div class="row">
        <button type="button" class="mc-btn grass" id="saveToken">Guardar token</button>
      </div>
    </section>

    <div id="codespaceList"></div>

    <section class="gui" id="footerSection" hidden>
      <p class="meta" id="refreshNote">Se actualiza cada pocos segundos.</p>
      <div class="row">
        <button type="button" class="mc-btn" id="refreshNow">Actualizar ahora</button>
        <button type="button" class="mc-btn" id="forgetToken">Quitar token de este dispositivo</button>
      </div>
    </section>
  </div>

  <script>
    // @ts-check
    "use strict";

    /**
     * @typedef {{
     *   name: string,
     *   display_name: string | null,
     *   state: string,
     *   repository: {full_name: string},
     *   machine: {display_name: string} | null
     * }} Codespace
     */
    /** @typedef {{total_count: number, codespaces: Codespace[]}} CodespaceList */
    /** @typedef {"online" | "busy" | "offline"} Tone */
    /** @typedef {{label: string, tone: Tone}} StateView */

    const API = "https://api.github.com";
    const TOKEN_KEY = "mc-launcher-token";
    const PANEL_PORT = 5050;
    const REFRESH_MS = 4000;

    /** @type {Readonly<Record<string, StateView>>} */
    const STATES = {
      Available: { label: "Encendido", tone: "online" },
      Shutdown: { label: "Apagado", tone: "offline" },
      Starting: { label: "Encendiendo", tone: "busy" },
      Queued: { label: "En cola", tone: "busy" },
      Provisioning: { label: "Preparando", tone: "busy" },
      Awaiting: { label: "Esperando", tone: "busy" },
      Created: { label: "Creado", tone: "busy" },
      Rebuilding: { label: "Reconstruyendo", tone: "busy" },
      ShuttingDown: { label: "Apagándose", tone: "busy" },
    };

    /** @param {string} id @returns {HTMLElement} */
    function byId(id) {
      const node = document.getElementById(id);
      if (node === null) {
        throw new Error(`Falta #${id}`);
      }
      return node;
    }

    /** @param {string} id @returns {HTMLInputElement} */
    function inputById(id) {
      const node = byId(id);
      if (!(node instanceof HTMLInputElement)) {
        throw new Error(`#${id} no es un input`);
      }
      return node;
    }

    /** @returns {string | null} */
    function readToken() {
      try {
        return window.localStorage.getItem(TOKEN_KEY);
      } catch {
        return null;
      }
    }

    /** @param {string | null} value */
    function writeToken(value) {
      try {
        if (value === null) {
          window.localStorage.removeItem(TOKEN_KEY);
        } else {
          window.localStorage.setItem(TOKEN_KEY, value);
        }
      } catch {
        showError("Este navegador no permite guardar el token. Desactiva el modo privado.");
      }
    }

    /** @param {string | null} message */
    function showError(message) {
      const box = byId("errorBox");
      box.textContent = message ?? "";
      box.hidden = message === null;
    }

    /**
     * @param {string} path
     * @param {"GET" | "POST"} method
     * @returns {Promise<Response>}
     */
    async function github(path, method) {
      const token = readToken();
      if (token === null) {
        throw new Error("Falta el token.");
      }
      return fetch(`${API}${path}`, {
        method,
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28",
        },
      });
    }

    /** @param {Response} response @returns {string} */
    function describeFailure(response) {
      if (response.status === 401) {
        return "GitHub rechazó el token. Puede haber vencido o estar mal copiado.";
      }
      if (response.status === 403 || response.status === 404) {
        return "El token no tiene permiso sobre Codespaces o ese Codespace ya no existe.";
      }
      return `GitHub respondió con el código ${response.status}.`;
    }

    /** @param {Codespace} codespace @returns {StateView} */
    function viewOf(codespace) {
      return STATES[codespace.state] ?? { label: codespace.state, tone: "busy" };
    }

    /**
     * @param {string} text
     * @param {string} className
     * @param {() => void} onClick
     * @returns {HTMLButtonElement}
     */
    function makeButton(text, className, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `mc-btn ${className}`.trim();
      button.textContent = text;
      button.addEventListener("click", onClick);
      return button;
    }

    /** @param {Codespace} codespace @returns {HTMLElement} */
    function renderCodespace(codespace) {
      const view = viewOf(codespace);
      const section = document.createElement("section");
      section.className = "gui";

      const title = document.createElement("h2");
      title.textContent = codespace.repository.full_name;
      section.appendChild(title);

      const status = document.createElement("div");
      status.className = "status";
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.dataset.tone = view.tone;
      dot.setAttribute("aria-hidden", "true");
      const label = document.createElement("strong");
      label.textContent = view.label;
      status.append(dot, label);
      section.appendChild(status);

      const meta = document.createElement("p");
      meta.className = "meta";
      const machine = codespace.machine?.display_name ?? "máquina sin datos";
      meta.textContent = `${codespace.display_name ?? codespace.name}, ${machine}`;
      section.appendChild(meta);

      const row = document.createElement("div");
      row.className = "row";

      const start = makeButton("Encender Codespace", "grass", () => {
        void changeState(codespace.name, "start");
      });
      start.disabled = codespace.state !== "Shutdown";

      const open = document.createElement("a");
      open.className = "mc-btn";
      open.textContent = "Abrir panel";
      open.target = "_blank";
      open.rel = "noopener";
      if (codespace.state === "Available") {
        open.href = `https://${codespace.name}-${PANEL_PORT}.app.github.dev/`;
      } else {
        open.setAttribute("aria-disabled", "true");
        open.addEventListener("click", (event) => event.preventDefault());
      }

      const stop = makeButton("Detener Codespace", "redstone", () => {
        const sure = window.confirm(
          "Detener el Codespace sin pasar por el panel puede perder el progreso del mundo. " +
            "Usa antes 'Apagar todo' en el panel. ¿Detenerlo de todos modos?"
        );
        if (sure) {
          void changeState(codespace.name, "stop");
        }
      });
      stop.disabled = codespace.state !== "Available";

      row.append(start, open, stop);
      section.appendChild(row);

      if (codespace.state === "Available") {
        const hint = document.createElement("p");
        hint.className = "meta";
        hint.textContent =
          "Si el panel no abre, espera unos 20 segundos: arranca solo después de que el Codespace queda encendido.";
        section.appendChild(hint);
      }
      return section;
    }

    /** @param {Codespace[]} codespaces */
    function renderList(codespaces) {
      const list = byId("codespaceList");
      if (codespaces.length === 0) {
        const empty = document.createElement("section");
        empty.className = "gui";
        const text = document.createElement("p");
        text.className = "meta";
        text.textContent = "Esta cuenta no tiene Codespaces. Créalo primero desde github.com/codespaces.";
        empty.appendChild(text);
        list.replaceChildren(empty);
        return;
      }
      list.replaceChildren(...codespaces.map(renderCodespace));
    }

    /** @type {number | undefined} */
    let timer;

    async function refresh() {
      window.clearTimeout(timer);
      if (readToken() === null) {
        showSetup();
        return;
      }
      try {
        const response = await github("/user/codespaces?per_page=50", "GET");
        if (!response.ok) {
          showError(describeFailure(response));
          if (response.status === 401) {
            showSetup();
          }
          return;
        }
        const data = /** @type {CodespaceList} */ (await response.json());
        showError(null);
        byId("tokenSection").hidden = true;
        byId("footerSection").hidden = false;
        renderList(data.codespaces);
      } catch {
        showError("No pude conectar con GitHub. Revisa tu internet.");
      } finally {
        timer = window.setTimeout(() => {
          void refresh();
        }, REFRESH_MS);
      }
    }

    function showSetup() {
      byId("tokenSection").hidden = false;
      byId("footerSection").hidden = true;
      byId("codespaceList").replaceChildren();
    }

    /**
     * @param {string} name
     * @param {"start" | "stop"} action
     */
    async function changeState(name, action) {
      try {
        const response = await github(`/user/codespaces/${encodeURIComponent(name)}/${action}`, "POST");
        if (!response.ok) {
          showError(describeFailure(response));
          return;
        }
        showError(null);
      } catch {
        showError("No pude conectar con GitHub. Revisa tu internet.");
      }
      await refresh();
    }

    byId("saveToken").addEventListener("click", () => {
      const value = inputById("tokenInput").value.trim();
      if (value === "") {
        showError("Pega primero el token.");
        return;
      }
      writeToken(value);
      inputById("tokenInput").value = "";
      showError(null);
      void refresh();
    });
    byId("refreshNow").addEventListener("click", () => {
      void refresh();
    });
    byId("forgetToken").addEventListener("click", () => {
      writeToken(null);
      showError(null);
      window.clearTimeout(timer);
      showSetup();
    });

    void refresh();
  </script>
</body>
</html>
